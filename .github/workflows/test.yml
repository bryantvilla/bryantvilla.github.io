name: Automated Test Suite

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint HTML
        run: npx --yes htmlhint index.html assets/resume.html

      - name: Verify site integrity & asset links
        run: node scripts/verify-site.js

      - name: Run desktop selection & layout unit tests
        run: node scripts/test-desktop-selection.mjs

      - name: Verify desktop browser & mobile scenarios
        run: node scripts/verify-desktop.mjs

      - name: Test terminal file aliases & easter eggs
        run: node scripts/test-terminal-aliases.mjs
