name: CI / CD - Test, Optimize & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skip in-progress runs on main
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint HTML
        run: npx --yes htmlhint index.html assets/resume.html

      - name: Verify site integrity & asset links
        run: node scripts/verify-site.js

      - name: Run desktop selection & layout unit tests
        run: node scripts/test-desktop-selection.mjs

      - name: Verify desktop browser & mobile scenarios
        run: node scripts/verify-desktop.mjs

      - name: Install image optimization tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq optipng jpegoptim

      - name: Losslessly optimize images
        run: |
          echo "Compressing PNG assets..."
          find assets/img -type f -name "*.png" -exec optipng -o2 {} +
          echo "Compressing JPG assets..."
          find assets/img -type f -name "*.jpg" -exec jpegoptim --strip-all {} +

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: validate-and-build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
